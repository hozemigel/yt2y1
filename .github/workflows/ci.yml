name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        package: [y1sync, yt2mp3]

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # y1sync's tagging tests use ffmpeg to generate the silent MP3 they
      # tag; yt2mp3's tests mock ensure_ffmpeg and don't need it installed.
      - name: Install ffmpeg (Linux)
        if: matrix.package == 'y1sync' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: matrix.package == 'y1sync' && runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: matrix.package == 'y1sync' && runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
