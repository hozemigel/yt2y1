name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        package: [y1sync, yt2mp3]

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # y1sync's tagging tests use ffmpeg to generate the audio they tag,
      # and its cache keys non-MP3 files on a chromaprint fingerprint, so
      # fpcalc (from chromaprint) must be on PATH too or those tests fall
      # back to a whole-file hash and fail. yt2mp3's tests mock
      # ensure_ffmpeg and need neither installed.
      - name: Install ffmpeg and chromaprint (Linux)
        if: matrix.package == 'y1sync' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libchromaprint-tools

      - name: Install ffmpeg and chromaprint (macOS)
        if: matrix.package == 'y1sync' && runner.os == 'macOS'
        run: brew install ffmpeg chromaprint

      - name: Install ffmpeg and chromaprint (Windows)
        if: matrix.package == 'y1sync' && runner.os == 'Windows'
        run: choco install ffmpeg fpcalc -y

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
