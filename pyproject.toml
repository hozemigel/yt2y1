[project]
name = "y1sync"
version = "0.1.0"
description = "Prepare and sync music libraries for the Innioasis Y1 player"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mutagen>=1.47",
    "psutil>=5.9",
    "requests>=2.31",
    # tomllib entered the standard library in 3.11; tomli is the backport.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
y1sync = "y1sync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
